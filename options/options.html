<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title data-i18n-doc="opt_doc_title">Élő feliratfordító — beállítások</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <header>
    <h1 data-i18n="appName"></h1>
    <p class="sub" data-i18n="opt_sub"></p>
  </header>

  <!-- 1. DeepL -->
  <section>
    <h2 data-i18n="opt_s1_title"></h2>
    <p class="hint" data-i18n-html="opt_s1_hint"></p>
    <div class="row">
      <input type="password" id="key" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx:fx" spellcheck="false">
      <button id="keyShow" class="ghost" type="button" data-i18n="opt_show"></button>
      <button id="keyTest" class="primary" type="button" data-i18n="opt_test"></button>
    </div>
    <div id="keyResult" class="result"></div>
    <p class="warn" data-i18n="opt_key_warn"></p>
  </section>

  <!-- Felolvasás -->
  <section>
    <h2 data-i18n="opt_stts_title"></h2>
    <p class="hint" data-i18n-html="opt_stts_hint"></p>
    <div class="row">
      <input type="password" id="gkey" data-i18n-ph="opt_tts_key_ph" spellcheck="false">
      <button id="gkeyShow" class="ghost" type="button" data-i18n="opt_show"></button>
      <button id="gkeyTest" class="primary" type="button" data-i18n="opt_test"></button>
    </div>
    <div id="ttsResult" class="result"></div>
    <p class="warn" data-i18n="opt_tts_key_warn"></p>

    <label class="check">
      <input type="checkbox" id="ttsEnabled">
      <span data-i18n="opt_tts_enable"></span>
    </label>
    <p class="hint" data-i18n="opt_tts_enable_hint"></p>

    <label class="field">
      <span class="lbl" data-i18n="opt_tts_voice_label"></span>
      <div class="row">
        <select id="ttsVoice"></select>
        <button id="voiceRefresh" class="ghost" type="button" data-i18n="opt_lang_refresh"></button>
      </div>
      <span class="hint" data-i18n="opt_tts_voice_hint"></span>
    </label>

    <label class="field">
      <span class="lbl"><span data-i18n="opt_tts_rate_label"></span> <b id="rateVal">1.0×</b></span>
      <input type="range" id="rate" min="0.25" max="2" step="0.05">
      <span class="hint" data-i18n="opt_tts_rate_hint"></span>
    </label>

    <label class="field">
      <span class="lbl"><span data-i18n="opt_tts_duck_label"></span> <b id="duckVal">20%</b></span>
      <input type="range" id="duck" min="0" max="100" step="5">
      <span class="hint" data-i18n="opt_tts_duck_hint"></span>
    </label>
  </section>

  <!-- 2. Oldalak -->
  <section>
    <h2 data-i18n="opt_s2_title"></h2>
    <p class="hint" data-i18n-html="opt_s2_hint"></p>
    <div class="row">
      <input type="text" id="domainInput" data-i18n-ph="opt_domain_ph" spellcheck="false">
      <button id="domainAdd" class="primary" type="button" data-i18n="opt_domain_add"></button>
    </div>
    <div id="domainResult" class="result"></div>
    <ul id="domainList" class="list"></ul>
  </section>

  <!-- 3. Működés -->
  <section>
    <h2 data-i18n="opt_s3_title"></h2>

    <label class="field">
      <span class="lbl" data-i18n="opt_lang_label"></span>
      <div class="row">
        <select id="target"></select>
        <button id="langRefresh" class="ghost" type="button" data-i18n="opt_lang_refresh"></button>
      </div>
      <span class="hint" data-i18n="opt_lang_hint"></span>
      <span id="langResult" class="result"></span>
    </label>

    <label class="field">
      <span class="lbl"><span data-i18n="opt_delay_label"></span> <b id="delayVal">1200 ms</b></span>
      <input type="range" id="delay" min="300" max="3000" step="100">
      <span class="hint" data-i18n="opt_delay_hint"></span>
    </label>

    <label class="field">
      <span class="lbl"><span data-i18n="opt_fs_label"></span> <b id="fsVal">20 px</b></span>
      <input type="range" id="fs" min="12" max="48" step="1">
    </label>

    <label class="field">
      <span class="lbl"><span data-i18n="opt_op_label"></span> <b id="opVal">85%</b></span>
      <input type="range" id="op" min="30" max="100" step="5">
    </label>

    <label class="check">
      <input type="checkbox" id="bilingual">
      <span data-i18n="opt_bilingual_label"></span>
    </label>

    <p class="hint" data-i18n="opt_s3_hint"></p>
  </section>

  <!-- 4. Célpontok -->
  <section>
    <h2 data-i18n="opt_s4_title"></h2>
    <p class="hint" data-i18n="opt_s4_hint"></p>
    <ul id="targetList" class="list"></ul>
  </section>

  <!-- 5. Előzmények -->
  <section>
    <h2 data-i18n="opt_s5_title"></h2>
    <div class="row spread">
      <span id="storageInfo" class="hint"></span>
      <button id="clearAll" class="danger" type="button" data-i18n="opt_clear_all"></button>
    </div>
    <div class="tablewrap">
      <table id="sessions">
        <thead>
          <tr><th data-i18n="opt_th_when"></th><th data-i18n="opt_th_site"></th><th data-i18n="opt_th_len"></th><th data-i18n="opt_th_lines"></th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer data-i18n-html="opt_footer"></footer>
</main>

<script src="../lib/i18n.js"></script>
<script src="../lib/store.js"></script>
<script src="../lib/deepl.js"></script>
<script src="../lib/tts.js"></script>
<script src="options.js"></script>
</body>
</html>
